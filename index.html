  <meta name="theme-color" content="#7a3f12">
  <link rel="icon" type="image/png" href="img/icon-192.png">

<body>
  <div class="backdrop" aria-hidden="true">
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>

  </div>

  <header class="topbar">
    <a class="brand" href="#/inicio">
      <img class="brand-mark" src="img/icon-192.png" alt="" width="40" height="40">

        <span class="brand-title">Nunca Stardew</span>
        <span class="brand-sub">Guía de Stardew Valley · 1.6</span>
      </span>
    </a>
    <div class="topbar-actions">
      <button class="top-btn" id="search-toggle" aria-controls="search" aria-expanded="false" aria-label="Buscar en la guía"><i class="px" data-i="search"></i><span>Buscar</span></button>
      <button class="top-btn menu-toggle" id="menu-toggle" aria-controls="sidebar" aria-expanded="false">Menú</button>

  <div class="scrim" id="scrim"></div>

  <section class="search" id="search" aria-label="Buscar en la guía">
    <label class="search-box">
      <i class="px" data-i="search"></i>
      <input type="search" id="search-input" placeholder="Fresa, Abigail, aspersor…" autocomplete="off" spellcheck="false" aria-label="Palabras clave">

    <div class="search-results swap" id="search-results"></div>
  </section>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Secciones">
      <ul class="nav-list" id="nav-list"></ul>
    </nav>

    <main class="main panel leaving" id="main" tabindex="-1"></main>

    </p>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
